<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>404 | Page Not Found</title>

<style>

body{

margin:0;
height:100vh;

display:flex;
align-items:center;
justify-content:center;

background:#050505;
color:white;

font-family:Arial,sans-serif;

text-align:center;

}

h1{

font-size:120px;
margin:0;

color:#8b5cff;

}

p{

opacity:.8;

font-size:20px;

}

a{

display:inline-block;

margin-top:30px;

padding:15px 30px;

background:#8b5cff;

color:white;

text-decoration:none;

border-radius:12px;

transition:.3s;

}

a:hover{

transform:translateY(-3px);

}

</style>

</head>

<body>

<div>

<h1>404</h1>

<p>This page doesn't exist.</p>

<a href="index.html">Go Home</a>

</div>

</body>

</html>
